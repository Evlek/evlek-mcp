# Keeps this repo from falling behind the hosted server unnoticed. Once a day
# it reads the live https://evlek.app/api/mcp (initialize → version,
# tools/list, resources/list) and runs `scripts/sync-from-live.mjs --check`,
# which writes nothing. When anything differs it opens an issue
# "Live MCP changed: <live> ≠ repo <repo>" listing the tools and fields that
# differ; if an open issue for the same live version exists, it adds a comment
# instead of opening another.
#
# It never changes the repo: the org does not let Actions open PRs. The sync
# itself stays a PR from `pnpm mcp:export-public` + `node
# scripts/sync-from-live.mjs`; Onur merges, and the `v*` tag that triggers
# registry-publish.yml stays a separate, approved step.

name: Live Sync

on:
  schedule:
    - cron: "41 5 * * *" # daily, after Contract Drift (05:17)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: live-sync
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Compare with the live server
        id: sync
        env:
          LIVE_SYNC_REPORT: ${{ runner.temp }}/live-sync-report.md
        run: |
          if ! node scripts/sync-from-live.mjs --check; then
            echo "::warning::evlek.app/api/mcp could not be read — live sync skipped, not failed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the issue
        if: steps.sync.outputs.changed == 'true'
        env:
          LIVE: ${{ steps.sync.outputs.live_version }}
          REPO: ${{ steps.sync.outputs.repo_version }}
          LIVE_SYNC_REPORT: ${{ runner.temp }}/live-sync-report.md
        run: |
          prefix="Live MCP changed: $LIVE ≠ repo"
          title="$prefix $REPO"
          {
            cat "$LIVE_SYNC_REPORT"
            echo
            echo "To sync: \`pnpm mcp:export-public\` in the source repo (main) for \`TOOLS.md\`, then \`node scripts/sync-from-live.mjs\` here, a CHANGELOG entry, and a PR. After merge, with approval: tag \`v$LIVE\` → registry-publish.yml."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/issue-body.md"
          issue=$(gh issue list --state open --limit 100 --json number,title \
            -q "[.[] | select(.title | startswith(\"$prefix\"))][0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/issue-body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue-body.md"
          fi
